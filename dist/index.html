<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="通过可交互坐标网格，直观学习二维矩阵与坐标变换。" />
    <meta name="theme-color" content="#111318" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111318'/%3E%3Cpath d='M13 50V14h38M13 38l13-13 10 8 15-19' fill='none' stroke='%23b7f34b' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>矩阵 · 坐标实验室</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#workspace" aria-label="矩阵坐标实验室首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>矩阵 · 坐标实验室</span>
      </a>
      <div class="topbar-progress" aria-label="课程进度">
        <span id="progressLabel">第 1 / 4 节</span>
        <span class="progress-track"><span id="progressBar"></span></span>
      </div>
      <button class="icon-button" id="resetAll" type="button" aria-label="重置实验" title="重置实验">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </header>

    <main id="workspace" class="workspace">
      <aside class="lesson-rail" aria-label="课程目录">
        <div class="rail-heading">
          <span>学习路径</span>
          <span class="rail-time">约 12 分钟</span>
        </div>
        <nav class="lesson-list">
          <button class="lesson-item active" data-lesson="vector" type="button">
            <span class="lesson-index">01</span>
            <span><strong>向量与坐标</strong><small>点如何表示方向</small></span>
            <span class="lesson-state" aria-hidden="true"></span>
          </button>
          <button class="lesson-item" data-lesson="scale" type="button">
            <span class="lesson-index">02</span>
            <span><strong>缩放与翻转</strong><small>对角线的作用</small></span>
            <span class="lesson-state" aria-hidden="true"></span>
          </button>
          <button class="lesson-item" data-lesson="rotate" type="button">
            <span class="lesson-index">03</span>
            <span><strong>旋转</strong><small>基向量改变方向</small></span>
            <span class="lesson-state" aria-hidden="true"></span>
          </button>
          <button class="lesson-item" data-lesson="shear" type="button">
            <span class="lesson-index">04</span>
            <span><strong>剪切与组合</strong><small>顺序为什么重要</small></span>
            <span class="lesson-state" aria-hidden="true"></span>
          </button>
        </nav>

        <section class="concept-card" aria-live="polite">
          <span class="eyebrow" id="lessonKicker">第 1 节 · 基础</span>
          <h1 id="lessonTitle">先认识一个向量</h1>
          <p id="lessonBody">向量 <b>v = (x, y)</b> 可以看成从原点出发的一支箭头。试着拖动图中的端点，观察坐标如何变化。</p>
          <div class="concept-note">
            <span aria-hidden="true">↳</span>
            <p id="lessonNote">横向是 x，纵向是 y。方向和长度共同决定一个向量。</p>
          </div>
        </section>
      </aside>

      <section class="lab-panel" aria-label="矩阵变换实验区">
        <div class="lab-heading">
          <div>
            <span class="eyebrow">交互画布</span>
            <h2>把矩阵变成看得见的动作</h2>
          </div>
          <div class="status-chip"><span></span>实时计算</div>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="gridCanvas" aria-label="二维坐标变换可视化。可拖动绿色向量端点。"></canvas>
          <div class="canvas-legend" aria-hidden="true">
            <span><i class="legend-dot original"></i>原向量</span>
            <span><i class="legend-dot transformed"></i>变换后</span>
          </div>
          <div class="drag-hint" id="dragHint">拖动端点试试看</div>
        </div>

        <div class="playback-row">
          <button class="play-button" id="playAnimation" type="button" aria-label="播放变换动画">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 8 6-8 6z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"/></svg>
          </button>
          <label for="progressSlider">变换进度</label>
          <input id="progressSlider" type="range" min="0" max="100" value="100" />
          <output id="progressOutput" for="progressSlider">100%</output>
        </div>

        <div class="equation-strip" aria-live="polite">
          <span class="equation-label">当前计算</span>
          <div class="equation" id="equation"></div>
          <div class="result-pill">结果 <strong id="resultVector">(2, 1)</strong></div>
        </div>
      </section>

      <aside class="control-panel" aria-label="变换控制台">
        <div class="panel-section">
          <div class="section-heading">
            <div><span class="eyebrow">变换矩阵</span><h2>A</h2></div>
            <button class="text-button" id="identityButton" type="button">单位矩阵</button>
          </div>
          <div class="matrix-editor" aria-label="二乘二矩阵输入">
            <span class="bracket left" aria-hidden="true"></span>
            <div class="matrix-grid">
              <label><span class="sr-only">矩阵第一行第一列</span><input id="m00" inputmode="decimal" value="1" /></label>
              <label><span class="sr-only">矩阵第一行第二列</span><input id="m01" inputmode="decimal" value="0" /></label>
              <label><span class="sr-only">矩阵第二行第一列</span><input id="m10" inputmode="decimal" value="0" /></label>
              <label><span class="sr-only">矩阵第二行第二列</span><input id="m11" inputmode="decimal" value="1" /></label>
            </div>
            <span class="bracket right" aria-hidden="true"></span>
          </div>
          <div class="determinant-row">
            <span>行列式 det(A)</span>
            <strong id="determinant">1</strong>
          </div>
        </div>

        <div class="panel-section preset-section">
          <div class="section-heading compact"><span class="eyebrow">快速实验</span></div>
          <div class="preset-grid" role="group" aria-label="矩阵预设">
            <button data-preset="rotate" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8a8 8 0 1 0 1 6M19 4v4h-4"/></svg><span>旋转 30°</span></button>
            <button data-preset="scale" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 21h5v-5M3 3l7 7M21 21l-7-7"/></svg><span>横向 ×1.5</span></button>
            <button data-preset="shear" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h12l-2 14H5z"/></svg><span>剪切</span></button>
            <button data-preset="reflect" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M5 7l-3 5 3 5M19 7l3 5-3 5"/></svg><span>关于 y 轴</span></button>
          </div>
        </div>

        <div class="panel-section vector-section">
          <div class="section-heading compact">
            <span class="eyebrow">输入向量 v</span>
            <span class="mini-hint">也可拖动画布端点</span>
          </div>
          <div class="vector-inputs">
            <label><span>x</span><input id="vectorX" inputmode="decimal" value="2" /></label>
            <label><span>y</span><input id="vectorY" inputmode="decimal" value="1" /></label>
          </div>
        </div>

        <section class="challenge-card" aria-labelledby="challengeTitle">
          <div class="challenge-topline"><span>随堂练习</span><span id="challengeCount">1 / 3</span></div>
          <h3 id="challengeTitle">这次变换的结果是？</h3>
          <p id="challengePrompt"></p>
          <div class="answer-row">
            <span>(</span>
            <label><span class="sr-only">答案 x 坐标</span><input id="answerX" inputmode="decimal" placeholder="x′" /></label>
            <span>,</span>
            <label><span class="sr-only">答案 y 坐标</span><input id="answerY" inputmode="decimal" placeholder="y′" /></label>
            <span>)</span>
            <button id="checkAnswer" type="button">检查</button>
          </div>
          <div class="feedback" id="feedback" role="status"></div>
        </section>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
